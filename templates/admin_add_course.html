{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 border p-4 bg-white shadow-sm">
        <h3>Create New Course</h3>
        <hr>
        {% if msg %}<div class="alert alert-danger">{{ msg }}</div>{% endif %}
        <form method="POST">
            <div class="mb-3">
                <label>Course Title</label>
                <input type="text" name="title" class="form-control" placeholder="e.g. Advanced Java" required>
            </div>
            <div class="mb-3">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="4"></textarea>
            </div>
            <p class="text-muted small">* This will automatically generate 3, 6, 12 months and Lifetime packages.</p>
            <button type="submit" class="btn btn-primary w-100">Save Course</button>
        </form>
    </div>
</div>
{% endblock %}
