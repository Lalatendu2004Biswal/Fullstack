<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">E-Learn</a>
            <div class="navbar-nav ms-auto">
                {% if current_user.is_authenticated %}
                    <span class="nav-link text-white">Hello, {{ current_user.username }}</span>
                    {% if current_user.is_admin %}
                        <a class="nav-item nav-link" href="{{ url_for('admin_dashboard') }}">Admin Panel</a>
                    {% else %}
                        <a class="nav-item nav-link" href="{{ url_for('dashboard') }}">Courses</a>
                        <a class="nav-item nav-link" href="{{ url_for('my_purchases') }}">My Purchases</a>
                    {% endif %}
                    <a class="nav-item nav-link btn btn-danger btn-sm text-white ms-2" href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                    <a class="nav-item nav-link" href="{{ url_for('login') }}">Login</a>
                    <a class="nav-item nav-link" href="{{ url_for('register') }}">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
