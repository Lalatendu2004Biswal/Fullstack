{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-5">
                <h3 class="text-center mb-4">Create Account</h3>
                
                {% if msg %}
                <div class="alert alert-warning text-center">{{ msg }}</div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="Create a strong password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Sign Up</button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="mb-0 text-muted">Already have an account?</p>
                    <a href="{{ url_for('login') }}" class="text-decoration-none">Login Here</a>
                </div>
            </div>
        </div>
        <p class="text-center text-muted mt-3 small">Admin Note: Registering with username 'admin' will grant admin privileges.</p>
    </div>
</div>
{% endblock %}
