{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Admin Dashboard</h2>
<div class="row text-center">
    <div class="col-md-4">
        <div class="card bg-primary text-white p-3">
            <h3>{{ total_users }}</h3>
            <p>Total Users</p>
            <a href="{{ url_for('admin_users') }}" class="text-white">View All</a>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card bg-success text-white p-3">
            <h3>{{ total_orders }}</h3>
            <p>Total Orders</p>
            <a href="{{ url_for('admin_orders') }}" class="text-white">View All</a>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card bg-dark text-white p-3">
            <h3>₹{{ total_revenue }}</h3>
            <p>Total Revenue</p>
        </div>
    </div>
</div>
<div class="mt-4">
    <a href="{{ url_for('admin_add_course') }}" class="btn btn-warning">➕ Add New Course</a>
</div>
{% endblock %}
