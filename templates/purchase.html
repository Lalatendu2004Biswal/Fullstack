{% extends "base.html" %}
{% block content %}
<div class="card mx-auto" style="max-width: 500px;">
    <div class="card-header bg-primary text-white">Confirm Purchase</div>
    <div class="card-body">
        <h4>{{ pkg.course_title }}</h4>
        <p class="text-muted">{{ pkg.name }} ({{ pkg.duration_months or 'Lifetime' }} months)</p>
        <h2 class="text-success">₹{{ pkg.price_inr }}</h2>
        <form method="POST">
            <button type="submit" class="btn btn-success btn-lg w-100 mt-3">Pay Now (Demo)</button>
        </form>
    </div>
</div>
{% endblock %}
